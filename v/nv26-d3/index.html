<style>
  :root{--plank:#17110D;--gold:#D9B25F;--cream:#FFF6E9;--kumkuma:#9E2233;--kumkuma-deep:#7C1827}
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0;background:var(--plank);color:var(--cream);
    font-family:-apple-system,'Segoe UI',Roboto,'Noto Sans Telugu',sans-serif}
  main{max-width:460px;margin:0 auto;padding:14px 14px 28px;display:flex;flex-direction:column;align-items:center}
  .frame{width:100%;border-radius:20px;padding:3px;
    background:linear-gradient(135deg,#C9A24F,#B08A2E 42%,#CFAE63 62%,#A98226);
    box-shadow:0 10px 30px rgba(0,0,0,.45)}
  .frame video{display:block;width:100%;aspect-ratio:9/16;border-radius:17px;background:#1A130E;object-fit:cover}
  .eyebrow{margin:16px 0 0;font-size:13px;font-weight:800;color:var(--gold);letter-spacing:.3px}
  h1{margin:6px 0 0;font-size:22px;line-height:1.45;font-weight:800;text-align:center}
  a.btn{display:block;width:100%;text-align:center;margin-top:18px;padding:16px 20px;border-radius:999px;
    background:var(--kumkuma);color:var(--cream);font-weight:800;text-decoration:none;font-size:17px;min-height:48px;
    box-shadow:0 8px 22px rgba(158,34,51,.35)}
  a.btn:active{background:var(--kumkuma-deep)}
  p.note{color:#CDBBA0;font-size:14px;line-height:1.6;text-align:center;margin:12px 0 0}
  .badges{display:flex;gap:12px;align-items:center;justify-content:center;margin-top:18px;flex-wrap:wrap}
  .badges a{display:inline-flex;align-items:center;height:52px;overflow:hidden;border-radius:9px}
  .badges img.as{height:52px}
  .badges img.gp{height:78px;margin:-13px 0}
  footer{margin-top:22px;font-size:11px;letter-spacing:1.5px;color:var(--gold);font-weight:700}
</style>

<body>
<main>
  <div class="frame">
    <video id="vid" src="/bhakti/video/story/nv26-d3-annapurna.mp4" poster="/bhakti/video/story/nv26-d3-annapurna.jpg"
      playsinline controls preload="metadata"></video>
  </div>
  <p class="eyebrow">శరన్నవరాత్రులు · 3వ రోజు</p>
  <h1>శ్రీ అన్నపూర్ణా దేవి · శ్రీ చంద్రఘంటా దేవి 🙏</h1>
  <p class="note">విజయవాడ ఆచారం: శ్రీ అన్నపూర్ణా దేవి · నవదుర్గ ఆచారం: శ్రీ చంద్రఘంటా దేవి</p>
  <a class="btn" id="open" href="#">యాప్‌లో పూజ చేయండి · Open in app</a>
  <p class="note" id="note">పాకెట్ పంచాంగం ఉచిత యాప్ — రోజూ అమ్మవారి దర్శనం, పూజ విధానం, పంచాంగం.</p>
  <div class="badges">
    <a id="badge-ios" href="https://apps.apple.com/app/id6787660096"><img class="as" alt="Download on the App Store" src="/badges/app-store.svg" width="156" height="52"></a>
    <a id="badge-android" href="https://play.google.com/store/apps/details?id=com.pocketpanchangam.app"><img class="gp" alt="Get it on Google Play" src="/badges/google-play.png" width="202" height="78"></a>
  </div>
  <footer>POCKETPANCHANGAM.COM</footer>
</main>
<script>
(function(){
  // A shared Navaratri video. Same attribution rails as 404.html / go.html:
  // ?s=<ref> (sanitised) is beaconed to Firestore 'clicks' once on landing,
  // and every store door goes through /go?r=<ref> so Apple ct= / Play
  // utm_source carry it. No ?s= → ref "vid-nv26d3".
  var qs = new URLSearchParams(location.search);
  var src = (qs.get("s") || qs.get("src") || "vid-nv26d3").toLowerCase().replace(/[^a-z0-9_-]/g, "").slice(0, 24);
  var ua = navigator.userAgent || "";
  var isAndroid = /Android/i.test(ua);
  var isIOS = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  function beacon(r){
    try {
      var id = r + "-" + Date.now() + "-" + Math.random().toString(36).slice(2, 8);
      fetch("https://firestore.googleapis.com/v1/projects/pocketpanchangam/databases/(default)/documents/clicks/" + id + "?key=AIzaSyCCWnpXL5StCbipAkvNk1Hc9RlUM9bvl64", {
        method: "PATCH", headers: { "content-type": "application/json" },
        body: JSON.stringify({ fields: { r: { stringValue: r }, p: { stringValue: isIOS ? "ios" : isAndroid ? "android" : "web" }, ts: { integerValue: String(Date.now()) } } }),
        keepalive: true
      }).catch(function(){});
    } catch (e) {}
  }
  beacon(src);
  // one extra beacon when the video actually starts playing (same rule shape)
  var played = false;
  document.getElementById("vid").addEventListener("play", function(){ if (!played) { played = true; beacon("vplay-nv26d3"); } });
  function go(store){ return "/go?r=" + src + (store ? "&p=" + store : ""); }
  document.getElementById("badge-ios").href = go("ios");
  document.getElementById("badge-android").href = go("android");
  var to = "vrat", deepQuery = "?p=sharannavaratri";
  var open = document.getElementById("open");
  function showInstall(store){
    open.textContent = "ఉచితంగా డౌన్‌లోడ్ చేయండి · Get the app";
    open.href = go(store);
    document.getElementById("note").textContent = "డౌన్‌లోడ్ అయ్యాక యాప్‌లో శరన్నవరాత్రుల పూజ కనిపిస్తుంది · After installing, Navaratri puja is right on Home.";
  }
  if (isAndroid) {
    open.href = "intent://" + to + deepQuery + "#Intent;scheme=pocketpanchangam;package=com.pocketpanchangam.app;" +
      "S.browser_fallback_url=" + encodeURIComponent("https://pocketpanchangam.com" + go("android")) + ";end";
    open.addEventListener("click", function(){
      var t = setTimeout(function(){ if (document.visibilityState === "visible") showInstall("android"); }, 1800);
      window.addEventListener("pagehide", function(){ clearTimeout(t); }, { once: true });
    });
  } else if (isIOS) {
    open.href = "pocketpanchangam://" + to + deepQuery;
    open.addEventListener("click", function(){
      var t = setTimeout(function(){ if (document.visibilityState === "visible") showInstall("ios"); }, 1800);
      window.addEventListener("pagehide", function(){ clearTimeout(t); }, { once: true });
    });
  } else {
    open.href = go();
  }
})();
</script>
</body>
</html>
