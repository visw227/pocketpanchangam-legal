<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>మన Mission Control</title>
<style>
  :root{--bg:#14100B;--card:#1D170F;--line:#2E2617;--gold:#E2B24A;--ink:#F6EFE0;--soft:#B6A88C;--faint:#7C7263;--good:#5FBF7F;--warn:#E2A33C;--bad:#D9534F;--kum:#C2455A}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,'Segoe UI',system-ui,sans-serif;padding:0 0 60px}
  .wrap{max-width:840px;margin:0 auto;padding:0 14px}
  .bar{position:sticky;top:0;z-index:9;background:rgba(20,16,11,.96);border-bottom:1px solid var(--line);padding:9px 14px;display:flex;align-items:center;gap:9px;font-size:12.5px}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--good);flex:none}
  .bar b{color:var(--ink);font-weight:700}
  .bar span{color:var(--soft)}
  h1{font-size:15px;font-weight:800;letter-spacing:.3px;margin:18px 0 3px}
  .sub{color:var(--faint);font-size:12.5px;margin-bottom:14px}
  h2{font-size:13px;font-weight:800;color:var(--gold);letter-spacing:.4px;margin:26px 0 9px;text-transform:uppercase}
  .brand{display:flex;align-items:center;gap:13px;margin:20px 0 6px}
  .mark{width:52px;height:52px;border-radius:12px;flex:none;display:block;box-shadow:0 2px 10px rgba(0,0,0,.45)}
  .bn{font-size:17px;font-weight:800;letter-spacing:2.6px;color:var(--ink)}
  .bt{font-size:11px;color:var(--faint);letter-spacing:.3px;margin-top:2px}
  .hero .k{font-size:10.5px;font-weight:800;color:var(--gold);letter-spacing:1.6px;margin-bottom:6px}
  .hero .days{color:var(--faint);font-size:12px;margin-top:2px}
  .hero{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:10px}
  .hero .n{font-size:52px;font-weight:800;letter-spacing:-1px;line-height:1.05}
  .hero .l{color:var(--soft);font-size:13px;margin-top:3px}
  .hero .d{margin-top:9px;font-size:13px;color:var(--good);font-weight:700}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .c{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px}
  .c .n{font-size:23px;font-weight:800;line-height:1.15}
  .c .l{color:var(--soft);font-size:12px;margin-top:2px}
  .c .h{color:var(--faint);font-size:11.5px;margin-top:5px;line-height:1.4}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:right;color:var(--faint);font-weight:700;font-size:11px;padding:0 0 7px;text-transform:uppercase;letter-spacing:.3px}
  th:first-child,td:first-child{text-align:left}
  td{text-align:right;padding:6px 0;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
  td.k{color:var(--soft)}
  .pill{display:inline-block;padding:1px 7px;border-radius:999px;font-size:11px;font-weight:700}
  .row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-top:1px solid var(--line);font-size:13.5px}
  .row:first-child{border-top:none}
  .row span{color:var(--soft)}
  .row b{font-variant-numeric:tabular-nums}
  /* Link rows carry TWO numbers — what moved today and the lifetime total.
     Fixed columns and tabular figures so the eye can run down them; today
     is the live signal and gets the colour, all-time stays quiet. */
  .row .nums{display:flex;align-items:baseline;gap:14px;font-variant-numeric:tabular-nums;white-space:nowrap}
  .row .nums .td{min-width:74px;text-align:right;color:var(--good);font-weight:700}
  .row .nums .td.zero{color:var(--faint);font-weight:400}
  .row .nums .at{min-width:96px;text-align:right;color:var(--soft)}
  .row .nums .at em{font-style:normal;color:var(--faint);font-size:11px;margin-left:4px}
  .spark{display:flex;align-items:flex-end;gap:3px;height:64px;margin-top:12px}
  .spark .b{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px;height:100%}
  .spark .b em{font-style:normal;font-size:9.5px;color:var(--soft);font-variant-numeric:tabular-nums;white-space:nowrap}
  .spark .b i{width:100%;background:var(--gold);border-radius:2px 2px 0 0;min-height:2px;opacity:.85}
  .xlab{display:flex;gap:3px;margin-top:4px}
  .xlab span{flex:1;text-align:center;font-size:9px;color:var(--faint)}
  .note{color:var(--faint);font-size:11.5px;line-height:1.5;margin-top:9px}
  details{margin-top:10px}
  summary{cursor:pointer;color:var(--gold);font-size:12.5px;font-weight:700;padding:9px 0}
  .fam{margin-top:12px}
  .fam h3{font-size:12.5px;font-weight:800;margin-bottom:2px}
  .fam .st{color:var(--faint);font-size:11.5px;margin-bottom:5px}
  .err{background:#2A1414;border:1px solid #5A2A2A;color:#E9B0B0;border-radius:10px;padding:9px;font-size:12px;margin-bottom:9px}
  .heat td{border-top:1px solid var(--line)}
  .heat .cell{border-radius:4px;padding:4px 0;font-weight:700;font-size:12px}
</style>
</head>
<body>
<div class="bar"><span class="dot" id="dot"></span><b id="fresh">loading…</b><span id="freshnote"></span></div>
<div class="wrap">
  <div class="brand">
    <img class="mark" src="applogo.png" alt="Pocket Panchangam" width="52" height="52">
    <div>
      <div class="bn">POCKET PANCHANGAM</div>
      <div class="bt">తెలుగు పంచాంగం · మన Mission Control</div>
    </div>
  </div>
  <div class="sub" id="asof">—</div>
  <div id="root"></div>
</div>
<script>
(function () {
  if (localStorage.getItem("dk") !== "srivari") {
    const p = prompt("passphrase?");
    if (p !== "srivari") { document.body.innerHTML = ""; return; }
    localStorage.setItem("dk", "srivari");
  }
  const $ = (h) => { const d = document.createElement("div"); d.innerHTML = h.trim(); return d.firstChild; };
  const n = (v) => v == null ? "—" : Number(v).toLocaleString("en-IN");
  const pct = (v) => v == null ? "—" : v + "%";
  const root = document.getElementById("root");

  // Each section renders independently: one bad key can never blank the page.
  function section(fn) {
    try { const el = fn(); if (el) root.appendChild(el); }
    catch (e) { root.appendChild($(`<div class="err">This section failed to render: ${String(e.message || e).slice(0, 120)}</div>`)); }
  }

  fetch("stats.json?cb=" + Date.now()).then(r => r.json()).then(d => {
    // ── freshness: never claim "live" when the cron has slipped ──
    const ageMin = Math.round((Date.now() - Date.parse(d.updated)) / 60000);
    const dot = document.getElementById("dot");
    dot.style.background = ageMin <= 15 ? "var(--good)" : ageMin <= 40 ? "var(--warn)" : "var(--bad)";
    document.getElementById("fresh").textContent =
      ageMin <= 1 ? "live" : ageMin + " min old";
    // MEASURED, NOT HOPED (2026-08-27): over 24h the cron asked for 144 runs
    // and GitHub started 16 — about one in nine. `schedule` is best-effort
    // and documented as such, and it is the first thing dropped on a busy
    // private repo. The old note here said "GitHub dropped a cron slot; it
    // self-heals", which is what the founder read at 164 minutes old while
    // it did not self-heal. A dashboard that misreports its own staleness is
    // worse than a stale one. Say the real number, and say what to do.
    document.getElementById("freshnote").textContent =
      ageMin <= 20 ? "· cron is keeping up"
      : ageMin <= 60 ? "· GitHub delayed the cron — numbers below are still " + ageMin + " min old"
      : "· cron has slipped badly; run: gh workflow run dashboard.yml -r master";
    const ist = new Date(Date.parse(d.updated) + 5.5 * 3600000).toISOString().slice(11, 16);
    document.getElementById("asof").textContent = "as of " + ist + " IST · " + d.istToday;

    // ══ THE FIVE — only numbers that can go DOWN ══
    section(() => {
      const el = $('<div></div>');
      el.appendChild($(`
        <div class="hero">
          <div class="k">APP INSTALLS · SINCE LAUNCH</div>
          <div class="n">${n(d.installsTotal)}</div>
          <div class="l">people using Pocket Panchangam</div>
          <div class="d">▲ +${n(d.installsTodayIst)} installs today</div>
          <div class="days">${(() => {
            const days = Object.keys(d.installsByDay || {}).sort();
            const first = days[0];
            const age = first ? Math.round((Date.now() - Date.parse(first)) / 86400000) : null;
            return age ? `in ${age} days` : "";
          })()}</div>
        </div>`));
      el.appendChild($(`
        <div class="grid">
          <div class="c"><div class="n">${n(d.returningDau)}</div><div class="l">came back today</div>
            <div class="h">opened the app in the last 24h AND installed before that. The real engagement number.</div></div>
          <div class="c"><div class="n">${n(d.newDau)}</div><div class="l">new users today</div>
            <div class="h">first-ever opens in the last 24h. This uses a rolling 24h window, so it differs from the
            "since midnight IST" figure above — both are correct, they measure different windows.</div></div>
          <div class="c"><div class="n">${pct(d.retentionCurve && d.retentionCurve.d1)}</div><div class="l">come back next day</div>
            <div class="h">of phones old enough to measure, share that came back after a full day.</div></div>
          <div class="c"><div class="n">${pct(d.matureActive7Pct)}</div><div class="l">active this week</div>
            <div class="h">of ${n(d.matureBase)} phones older than a day, share seen this week.</div></div>
        </div>`));
      return el;
    });

    // ── why MAU/WAU are not up there ──
    section(() => d.mauIsDegenerate ? $(`
      <div class="panel" style="margin-top:10px">
        <div class="note" style="margin:0">
          <b style="color:var(--soft)">Why MAU and WAU are not shown above.</b>
          The app is younger than 30 days, so MAU (${n(d.mau)}) is arithmetically identical to total installs —
          it cannot yet mean anything. WAU (${n(d.wau)}) is ${Math.round(d.wau / d.installsTotal * 100)}% of all installs
          for the same reason. Both are kept below for completeness; the four cards above are the ones that can fall.
        </div>
      </div>`) : null);

    // ══ RETENTION — one comparable cohort set + the triangle ══
    section(() => {
      const c = d.retentionCurve || {}, b = d.retentionBasis || {};
      const cols = ["d1", "d3", "d7", "d14", "d30"];
      const el = $('<div></div>');
      el.appendChild($(`<h2>Retention</h2>`));
      el.appendChild($(`
        <div class="panel">
          <table><tr>${cols.map(k => `<th style="text-align:center">${k.toUpperCase()}</th>`).join("")}</tr>
          <tr>${cols.map(k => `<td style="text-align:center;font-size:19px;font-weight:800">${pct(c[k])}</td>`).join("")}</tr></table>
          <div class="note">Every column is measured on the <b>same ${n(b.devices)} phones</b> (${b.cohorts} cohorts old enough
          to reach day ${b.throughDay}). Comparing columns across different cohort sets is what previously produced an
          impossible curve where day-7 beat day-1.</div>
        </div>`));

      // cohort triangle — newest first, colour by value
      const rows = (d.cohorts || []).slice().reverse().slice(0, 12);
      // A cohort's day-N number keeps RISING for days after the window opens:
      // a phone that installed at 23:00 only becomes measurable 24h later and
      // has had almost no chance to return yet. Cells younger than 2 days past
      // their window are marked ↑ so a low number is not read as final.
      const DAYN = { d1: 1, d3: 3, d7: 7, d14: 14, d30: 30 };
      const cell = (v, fo, k) => {
        if (v == null) return `<td class="k">·</td>`;
        const opened = Date.parse(fo) + DAYN[k] * 86400000;
        const climbing = Date.now() - opened < 2 * 86400000;
        const a = Math.max(0, Math.min(1, v / 60));
        return `<td><span class="cell" style="background:rgba(226,178,74,${0.10 + a * 0.55});padding:3px 6px${climbing ? ";opacity:.65" : ""}">${v}%${climbing ? "<span style=\"color:var(--warn)\">↑</span>" : ""}</span></td>`;
      };
      el.appendChild($(`
        <div class="panel">
          <table class="heat">
            <tr><th>cohort</th><th>size</th>${cols.map(k => `<th>${k}</th>`).join("")}</tr>
            ${rows.map(r => `<tr><td class="k">${r.fo}</td><td>${n(r.size)}</td>${cols.map(k => cell(r[k], r.fo, k)).join("")}</tr>`).join("")}
          </table>
          <div class="note">
            <b style="color:var(--soft)">How this is calculated.</b> A row is everyone whose very first open was on that
            date. <b>D1</b> = of those phones, the share seen again at least 24 hours after <i>their own</i> first open
            (not midnight — each phone is measured from its own clock). D3, D7, D14 are the same at 3, 7 and 14 days.<br><br>
            <b>·</b> means the window has not opened yet — not zero.
            <b style="color:var(--warn)">↑</b> means the window opened less than 2 days ago, so the number is still
            climbing and will rise: a phone that installed last night only became measurable this morning and has barely
            had a chance to return. Judge a cohort only after its ↑ is gone.<br><br>
            The newest, biggest cohorts retain worse than the older organic ones. That is the viral wave, and it is the
            honest read — mass-arriving curiosity traffic always retains below word-of-mouth traffic.
          </div>
        </div>`));
      return el;
    });

    // ══ GROWTH ══
    section(() => {
      const byd = d.installsByDay || {};
      const days = Object.keys(byd).sort().slice(-14);
      const max = Math.max(...days.map(k => byd[k]), 1);
      const hrs = d.installsByHourIst || {};
      const hkeys = Object.keys(hrs).sort();
      const hmax = Math.max(...hkeys.map(k => hrs[k]), 1);
      return $(`
        <div><h2>Growth</h2>
        <div class="panel">
          <div class="row" style="border:none"><span>installs · last 14 days</span><b>${n(days.reduce((s, k) => s + byd[k], 0))}</b></div>
          <div class="spark">${days.map(k => `<span class="b"><em>${byd[k] >= 1000 ? (byd[k]/1000).toFixed(1)+"k" : byd[k]}</em><i style="height:${Math.round(byd[k] / max * 88)}%"></i></span>`).join("")}</div>
          <div class="xlab">${days.map(k => `<span>${k.slice(8)}</span>`).join("")}</div>
          <div class="note">${days[0]} → ${days[days.length - 1]} · day of month below each bar</div>
        </div>
        <div class="panel">
          <div class="row" style="border:none"><span>today by hour · IST</span><b>${n(d.installsTodayIst)}</b></div>
          <div class="spark">${hkeys.map(k => `<span class="b"><em>${hrs[k] >= 1000 ? (hrs[k]/1000).toFixed(1)+"k" : hrs[k]}</em><i style="height:${Math.round(hrs[k] / hmax * 88)}%"></i></span>`).join("")}</div>
          <div class="xlab">${hkeys.map(k => `<span>${k}</span>`).join("")}</div>
          <div class="note">Real IST hours. The install counter itself rolls over at 05:30 IST (midnight UTC), so this is the
          only view that shows a festival morning whole.</div>
        </div></div>`);
    });


    // ══ CAMPAIGN IMPACT — which post moved the needle ══
    section(() => {
      const cs = d.campaigns || [];
      const hrs = d.installsByHourAll || {};
      const keys = Object.keys(hrs).sort().slice(-72);
      const hmax = Math.max(...keys.map(k => hrs[k]), 1);
      const posts = cs.filter(c => c.at).map(c => new Date(c.at).toISOString().slice(0, 13));
      const el = $(`<div><h2>Campaign impact</h2></div>`);
      el.appendChild($(`
        <div class="panel">
          <div class="row" style="border:none"><span>installs per hour · last 72h (IST)</span><b>${n(keys.reduce((s,k)=>s+hrs[k],0))}</b></div>
          <div class="spark" style="height:70px">${keys.map(k => {
            const isPost = posts.some(p => new Date(Date.parse(k + ":00:00Z")).toISOString().slice(0,13) === p);
            return `<span class="b"><i style="height:${Math.round(hrs[k] / hmax * 92)}%;background:${isPost ? "var(--kum)" : "var(--gold)"}" title="${k} — ${hrs[k]}"></i></span>`;
          }).join("")}</div>
          <div class="note">Rebuilt hour by hour from every install's own timestamp — the full history, not just today.
          Red bars are hours a campaign went live.</div>
        </div>`));
      if (!cs.length) {
        el.appendChild($(`<div class="panel"><div class="note" style="margin:0">
          No campaigns listed yet. Add each reel/post to <b>dash/campaigns.json</b> in the content repo
          — creator, label, and the exact go-live time — and the lift below is computed automatically.
        </div></div>`));
        return el;
      }
      for (const c of cs) {
        if (c.error) { el.appendChild($(`<div class="panel"><div class="note">${c.label || c.creator}: ${c.error}</div></div>`)); continue; }
        const t = new Date(Date.parse(c.at) + 5.5 * 3600000).toISOString().replace("T", " ").slice(0, 16);
        const w = (k, lbl) => `<tr><td class="k">${lbl}</td><td>${n(c[k].installs)}</td><td class="k">${n(c[k].expected)}</td>
          <td style="color:${c[k].lift > 0 ? "var(--good)" : "var(--soft)"};font-weight:800">${c[k].lift > 0 ? "+" : ""}${n(c[k].lift)}</td></tr>`;
        el.appendChild($(`
          <div class="panel fam">
            <h3>${c.label}</h3>
            <div class="st">${c.platform || "post"} · went live ${t} IST · baseline ${n(c.baselinePerHour)} installs/hour before</div>
            <table>
              <tr><th>window</th><th>installs</th><th>expected</th><th>lift</th></tr>
              ${w("h2", "first 2h")}${w("h6", "first 6h")}${w("h24", "first 24h")}
            </table>
          </div>`));
      }
      el.appendChild($(`<div class="panel"><div class="note" style="margin:0">
        <b style="color:var(--soft)">How to read this.</b> A collab reel sends people to your profile and then the bio
        link, so the click never carries the creator's name — timing is the only honest signal available without
        changing the install flow. <b>Expected</b> is the median hourly install rate over the 24h before the post,
        extended across the window. <b>Lift</b> is everything above that. Overlapping posts share credit, so keep the
        windows short when two creators post the same evening.
      </div></div>`));
      return el;
    });

    // ══ WHERE ══
    section(() => {
      const reg = d.byRegion || {}, dau = d.dauByRegion || {};
      const keys = Object.keys(reg).sort((a, b) => reg[b] - reg[a]);
      return $(`
        <div><h2>Where</h2>
        <div class="panel"><table>
          <tr><th>region</th><th>installs</th><th>active today</th><th>share</th></tr>
          ${keys.map(k => `<tr><td class="k">${k}</td><td>${n(reg[k])}</td><td>${n(dau[k] || 0)}</td>
            <td>${Math.round(reg[k] / d.installsTotal * 100)}%</td></tr>`).join("")}
        </table></div></div>`);
    });

    // ══ CHANNELS — families, not 65 flat rows ══
    section(() => {
      const ch = d.channels || {};
      const order = ["creator", "campaign", "unattributed", "share", "test"];
      const label = {
        creator: ["Creators", "named people sharing your link"],
        campaign: ["Campaigns", "your own posts and placements"],
        unattributed: ["Unattributed", "opened the link with no ref — cannot be credited to anyone"],
        share: ["Shares from inside the app", "OUTBOUND — a user pressed share. Never a click; excluded from the click total."],
        test: ["Tests", "your own probes"],
      };
      const el = $(`<div><h2>Channels</h2></div>`);
      el.appendChild($(`
        <div class="panel">
          <div class="row" style="border:none"><span>inbound clicks (real taps)</span><b>${n(d.inboundClicks)}</b></div>
          <div class="row"><span>installs</span><b>${n(d.installsTotal)}</b></div>
          <div class="note">These two will never match, and that is correct — they count different populations.
          A click is a landing-page hit (many never install, some install days later, one person can tap five times);
          an install is a phone that opened the app (many arrive from store search with no link at all).
          <br><br><b style="color:var(--soft)">Why creator clicks are tiny next to installs.</b>
          Tracked creator links account for ${n((d.channels&&d.channels.creator)?d.channels.creator.clicks:0)} taps, but installs are
          ${n(d.installsTotal)} — because almost nobody arrives through a tracked creator link. The wave is coming from
          your own Instagram (${n((d.channels&&d.channels.campaign)?d.channels.campaign.clicks:0)} taps), from
          ${n((d.channels&&d.channels.unattributed)?d.channels.unattributed.clicks:0)} taps that carried no ref at all,
          and from people who never touched a link — store search, a forwarded screenshot, word of mouth.
          <b>99.5% of installs currently have no known source.</b> That is the single biggest gap in this dashboard, and
          Play's own per-source export (which also carries retention per source) is the fix.<br><br>
          Only the store's own campaign data can join the two, and today that covers
          <b>${n((d.ios && d.ios.byCampaign) ? Object.values(d.ios.byCampaign).reduce((s, v) => s + (v.total || 0), 0) : 0)}</b>
          iOS installs. Android — ~92% of users — is not wired up yet.</div>
        </div>`));
      for (const k of order) {
        const f = ch[k]; if (!f) continue;
        el.appendChild($(`
          <div class="panel fam">
            <h3>${label[k][0]} · ${n(f.clicks)}</h3>
            <div class="st">${label[k][1]} — ${f.refs} link${f.refs === 1 ? "" : "s"}</div>
            ${(f.top || []).map(t => `<div class="row"><span>${t.ref}</span><span class="nums">
              <span class="td${t.today ? "" : " zero"}">${t.today ? "+" + n(t.today) + " today" : "—"}</span>
              <span class="at">${n(t.clicks)}<em>all-time</em></span>
            </span></div>${
              t.storeInstalls != null
                ? `<div class="row" style="border-top:none;padding-top:0"><span></span><span class="nums"><span class="td"></span><span class="at" style="color:var(--good)">${t.storeInstalls}<em>iOS installs</em></span></span></div>`
                : ""
            }`).join("")}
          </div>`));
      }
      return el;
    });

    // ══ PUJA HUBS — one panel per puja, not one panel called వరలక్ష్మీ ══
    // Every puja shares VrathamSheet, so until 2026-08-26 they all wrote into
    // one doc and the dash could only ever show a blend. `pujaHubs` groups
    // them; `vratham` is kept as the fallback for stats.json written by an
    // older cron, and for the poll file that still reads it.
    const HUB_LABEL = {
      varalakshmi: "వరలక్ష్మీ వ్రతం",
      krishnashtami: "శ్రీకృష్ణ జన్మాష్టమి",
    };
    section(() => {
      const hubs = d.pujaHubs || (d.vratham ? { varalakshmi: d.vratham } : null);
      if (!hubs) return null;
      const el = $(`<div><h2>పూజ hubs</h2></div>`);
      // Most-reached first: the puja people are actually in right now.
      Object.entries(hubs)
        .sort((a, b) => (b[1].reached || 0) - (a[1].reached || 0))
        .forEach(([id, v]) => {
          const rows = Object.entries(v).filter(([, x]) => typeof x === "number");
          if (!rows.length) return;
          el.appendChild($(`
            <div class="panel fam">
              <h3>${HUB_LABEL[id] || id} · ${n(v.reached || 0)}</h3>
              <div class="st">reached — installs that opened this hub</div>
              ${rows.map(([k, x]) => `<div class="row"><span>${k}</span><b>${n(x)}</b></div>`).join("")}
            </div>`));
        });
      return el;
    });

    // ══ WHERE INSTALLS COME FROM — the store's own answer ══════════════
    // The 18 Aug spike was 21,034 installs against 786 taps on the creator's
    // tracked link, and every creator decision was being made on that link.
    // The stores were holding the truth the whole time: Apple splits
    // downloads by Source Type, Play by Traffic source — and Play also
    // reports the SEARCH TERMS people typed. A reel does not send people
    // through a link; it sends them to type your name into the store.
    section(() => {
      const ios = d.ios || {}, andr = d.android || {};
      const iosSrc = ios.bySource || {}, plaSrc = andr.bySource || {};
      if (!Object.keys(iosSrc).length && !Object.keys(plaSrc).length) return null;
      const el = $(`<div><h2>Where installs come from</h2>
        <div class="st" style="margin-bottom:10px">the stores' own attribution — not our link taps</div></div>`);
      const rows = (title, obj, key, note) => {
        const es = Object.entries(obj).sort((a, b) => (b[1][key] || 0) - (a[1][key] || 0));
        if (!es.length) return "";
        const tot = es.reduce((s, [, v]) => s + (v[key] || 0), 0) || 1;
        return `<div class="panel fam"><h3>${title}</h3>${note ? `<div class="st">${note}</div>` : ""}${
          es.map(([k, v]) => {
            const pct = Math.round(((v[key] || 0) / tot) * 1000) / 10;
            return `<div class="row"><span>${k}</span><span class="nums">
              <span class="td${pct >= 50 ? "" : " zero"}">${pct}%</span>
              <span class="at">${n(v[key] || 0)}<em>installs</em></span></span></div>`;
          }).join("")
        }</div>`;
      };
      // ── THE LIFT ───────────────────────────────────────────────────────
      // The first version of this took a median across the days Play gave us
      // and called it "a normal day". Four of those seven days were spike
      // days, so the median WAS the spike -- it reported a 3x lift on a day
      // that was really more than a hundred times a quiet one. Multipliers
      // are fragile when the baseline is mostly the event you are measuring.
      //
      // So this states the thing plainly instead: on the biggest day, how
      // many people typed our name versus how many arrived through a link.
      // That ratio needs no baseline and cannot be inflated by a short
      // export window. The quiet-day figure below it is a low percentile,
      // labelled as such, and is context -- not the headline.
      const bdOf = (k) => ((plaSrc[k] || {}).byDay) || {};
      const allDays = {};
      for (const k of Object.keys(plaSrc))
        for (const [d0, v] of Object.entries(bdOf(k))) allDays[d0] = (allDays[d0] || 0) + v;
      const dayKeys = Object.keys(allDays).sort();
      if (dayKeys.length >= 3) {
        let peak = dayKeys[0];
        for (const k of dayKeys) if (allDays[k] > allDays[peak]) peak = k;
        const sDay = bdOf("Google Play search")[peak] || 0;
        const rDay = bdOf("Ads and referrals")[peak] || 0;
        const ratio = rDay > 0 ? Math.round((sDay / rDay) * 10) / 10 : null;
        // quiet day = 20th percentile of branded-search days, so a handful of
        // spike days cannot drag it upward the way a median did.
        const sv = Object.values(bdOf("Google Play search")).slice().sort((a, b) => a - b);
        const quiet = sv.length ? sv[Math.floor((sv.length - 1) * 0.2)] : 0;
        const pretty = new Date(peak + "T00:00:00").toLocaleDateString("en-IN",
          { day: "numeric", month: "short" });
        el.insertAdjacentHTML("beforeend", `<div class="panel fam">
          <h3>What a creator actually causes</h3>
          <div class="st">the biggest day so far — ${pretty} — Play installs by how they arrived</div>
          <div class="row"><span>typed our name into Play</span><span class="nums">
            <span class="td">${ratio ? ratio + "\u00d7" : ""}</span>
            <span class="at">${n(sDay)}<em>installs</em></span></span></div>
          <div class="row"><span>arrived through any link</span><span class="nums">
            <span class="td zero"></span>
            <span class="at">${n(rDay)}<em>installs</em></span></span></div>
          <div class="row"><span style="opacity:.7">a quiet day's branded search, for scale</span>
            <span class="nums"><span class="td zero"></span>
            <span class="at">${n(quiet)}<em>installs</em></span></span></div>
        </div>`);
        el.insertAdjacentHTML("beforeend", `<div class="panel fam">
          <h3>Branded search, day by day</h3>
          <div class="st">searched our name, then installed — a spike is not a plateau</div>
          ${Object.keys(bdOf("Google Play search")).sort().slice(-14).map(k =>
            `<div class="row"><span>${k}</span>
            <span class="nums"><span class="td zero"></span>
            <span class="at">${n(bdOf("Google Play search")[k])}<em>installs</em></span></span></div>`).join("")}
        </div>`);
      }
      el.insertAdjacentHTML("beforeend", rows("Google Play", plaSrc, "acq", "store listing acquisitions"));
      el.insertAdjacentHTML("beforeend", rows("App Store", iosSrc, "total", "Apple source type"));
      // WHAT THEY TYPED. This is the closest thing to a brand-strength meter
      // we have, and it is the only place a creator's real effect is visible.
      const terms = andr.topTerms || [];
      if (terms.length) {
        el.insertAdjacentHTML("beforeend", `<div class="panel fam"><h3>What they typed to find you</h3>
          <div class="st">Play search terms — a reel's true footprint</div>${
            terms.map(([t, c]) => `<div class="row"><span>${t}</span><span class="nums">
              <span class="td zero"></span><span class="at">${n(c)}<em>installs</em></span></span></div>`).join("")
          }</div>`);
      }
      const utm = andr.byUtm || {};
      const tagged = Object.entries(utm).filter(([k]) => !/^No UTM/i.test(k));
      if (tagged.length) {
        el.insertAdjacentHTML("beforeend", `<div class="panel fam"><h3>Tagged links, as the STORE counted them</h3>
          <div class="st">compare against creator link taps above — the gap is the real reach</div>${
            tagged.map(([k, v]) => `<div class="row"><span>${k}</span><span class="nums">
              <span class="td zero"></span><span class="at">${n(v.acq || 0)}<em>installs</em></span></span></div>`).join("")
          }</div>`);
      }
      return el;
    });

    // ══ FEATURED BRAND PILOT — the funnel this experiment exists for ══
    // impression → click → outbound, and the two rates that decide whether
    // contextual brand discovery is worth building on. Placement rows show
    // WHERE intent actually happens; festival and language live in GA4.
    section(() => {
      const b = d.brandCollab; if (!b || !b.impressions) return null;
      const pct = (x, y) => y > 0 ? Math.round((x / y) * 1000) / 10 : 0;
      // REACH first, not impressions: reach is unique installs, which is
      // what a rate card prices — a placement seen many times by few people
      // should not outrank one that reached many people once each.
      const rows = Object.entries(b.byPlacement || {})
        .sort((x, y) => y[1].reach - x[1].reach);
      const big = (label, val, sub) => `
        <div style="flex:1;min-width:88px">
          <div style="font-size:11px;color:var(--soft)">${label}</div>
          <div style="font-size:20px;font-weight:700;color:var(--gold);line-height:1.3">${val}</div>
          ${sub ? `<div style="font-size:10.5px;color:var(--faint)">${sub}</div>` : ""}
        </div>`;
      return $(`
        <div><h2>Featured brand — pilot funnel</h2>
        <div class="panel">
          <div style="display:flex;gap:10px;flex-wrap:wrap">
            ${big("CTR", b.ctr + "%", "clicks / impressions")}
            ${big("Outbound", b.outboundRate + "%", "reached Instagram")}
            ${big("Handoff", b.handoffRate + "%", "of taps that opened")}
          </div>
        </div>
        <div class="panel">
          <div class="row"><span>reach (unique installs, any placement)</span><b>${n(b.reach)}</b></div>
          <div class="row"><span>India / NRI</span><b>${n(b.reachIndia)} · ${n(b.reachNri)}</b></div>
          <div class="row"><span>impressions</span><b>${n(b.impressions)}</b></div>
          <div class="row"><span>clicks</span><b>${n(b.clicks)}</b></div>
          <div class="row"><span>outbound to Instagram</span><b>${n(b.outbound)}</b></div>
        </div>
        <div class="panel"><h3 style="font-size:12px;color:var(--soft);margin-bottom:6px">By placement — ranked by reach, the pricing metric</h3>
          ${rows.length ? rows.map(([p, v]) => `
            <div style="margin-bottom:10px">
              <div class="row" style="border:0;padding:0">
                <span>${p}</span>
                <b>${n(v.reach)} reached</b>
              </div>
              <div style="font-size:10.5px;color:var(--faint)">
                ${n(v.impressions)} seen (${n(v.reach)} unique) · ${n(v.clicks)} tapped ·
                ${n(v.outbound)} opened · ${v.ctrByReach}% CTR by reach · ${v.ctr}% CTR by impression
              </div>
              <div style="height:4px;border-radius:2px;background:var(--line);margin-top:3px">
                <div style="height:4px;border-radius:2px;width:${Math.min(100, v.ctrByReach)}%;background:var(--gold)"></div>
              </div>
            </div>`).join("") : `<div class="note">No impressions yet.</div>`}
          <div class="note">CTR by reach = clicks ÷ unique installs — price a slot on this, not on
          raw impressions, which one chatty repeat visitor can inflate. Festival and language
          breakdowns are in GA4 on the same three events (brand_collab_impression / _click / _outbound).</div>
        </div></div>`);
    });

    // ══ PUJA COMPANION — what families are asking us to build next ══
    // Same shape as the vratham hub above: totals first, then the ranked
    // demand, then the free-text asks. Those asks are ADMIN-ONLY by design —
    // they are never served back to the app, because showing one family's
    // words to another turns this into user-generated content.
    section(() => {
      const w = d.pujaWish; if (!w || !w.voters) return null;
      const rank = Object.entries(w.byPuja || {}).sort((a, b) => b[1] - a[1]);
      const pct = (x) => w.voters ? Math.round((x / w.voters) * 100) : 0;
      const bar = (x) => `<div style="height:4px;border-radius:2px;background:var(--line);margin-top:3px">
        <div style="height:4px;border-radius:2px;width:${pct(x)}%;background:var(--gold)"></div></div>`;
      const reqs = (w.requests || []).slice().reverse();
      return $(`
        <div><h2>Puja Companion — what to build next</h2>
        <div class="panel">
          <div class="row"><span>families who voted</span><b>${n(w.voters)}</b></div>
          <div class="row"><span>votes cast</span><b>${n(w.votes)}</b></div>
          <div class="row"><span>India / NRI</span><b>${n(w.votesIndia)} · ${n(w.votesNri)}</b></div>
          <div class="row"><span>asked for something not on the list</span><b>${n(reqs.length)}</b></div>
        </div>
        <div class="panel"><h3 style="font-size:12px;color:var(--soft);margin-bottom:6px">Most wanted</h3>
          ${rank.length ? rank.map(([id, x]) => `
            <div style="margin-bottom:7px">
              <div class="row" style="border:0;padding:0"><span>${id}</span><b>${n(x)} · ${pct(x)}%</b></div>
              ${bar(x)}
            </div>`).join("") : `<div class="note">No votes yet.</div>`}
        </div>
        <div class="panel"><h3 style="font-size:12px;color:var(--soft);margin-bottom:6px">Free-text asks — admin only, newest first</h3>
          ${reqs.length ? reqs.map((r) => `<div class="row"><span>${
            String(r.text).replace(/[<>&]/g, (c) => ({ "<": "&lt;", ">": "&gt;", "&": "&amp;" }[c]))
          }</span><b style="font-size:11px;color:var(--soft)">${r.band === "p330" ? "IN" : "NRI"}</b></div>`).join("")
            : `<div class="note">Nothing yet.</div>`}
        </div></div>`);
    });

    // ══ OPS drawer ══
    section(() => {
      const kv = (o) => Object.entries(o || {}).sort((a, b) => b[1] - a[1])
        .map(([k, x]) => `<div class="row"><span>${k}</span><b>${n(x)}</b></div>`).join("");
      return $(`
        <details>
          <summary>Diagnostics ▾</summary>
          <div class="panel"><h3 style="font-size:12px;color:var(--soft);margin-bottom:6px">Legacy activity counters</h3>
            <div class="row"><span>DAU (rolling 24h)</span><b>${n(d.dau)}</b></div>
            <div class="row"><span>WAU</span><b>${n(d.wau)}</b></div>
            <div class="row"><span>MAU${d.mauIsDegenerate ? " (degenerate)" : ""}</span><b>${n(d.mau)}</b></div>
            <div class="row"><span>active in last 5 min</span><b>${n(d.activeNow)}</b></div>
          </div>
          <div class="panel"><h3 style="font-size:12px;color:var(--soft);margin-bottom:6px">Platform / version</h3>${kv(d.byPlatform)}${kv(d.byVersion)}</div>
          <div class="panel"><h3 style="font-size:12px;color:var(--soft);margin-bottom:6px">Notification permission</h3>${kv(d.byNotifPerm)}</div>
          <div class="panel"><h3 style="font-size:12px;color:var(--soft);margin-bottom:6px">Store truth</h3>
            <div class="row"><span>iOS installs (Apple)</span><b>${n(d.ios && d.ios.total)}</b></div>
            <div class="row"><span>Android installs (Play)</span><b>${n(d.android && d.android.totalUserInstalls)}</b></div>
            <div class="note">Apple lags 24–48h. Play's per-source export is detected but not parsed yet — that is the
            next unlock, and it carries Google's own retention per creator.</div>
          </div>
        </details>`);
    });
  }).catch(e => {
    root.appendChild($(`<div class="err">Could not load stats.json — ${String(e.message || e).slice(0, 140)}</div>`));
    document.getElementById("dot").style.background = "var(--bad)";
    document.getElementById("fresh").textContent = "no data";
  });
})();
</script>
</body>
</html>
