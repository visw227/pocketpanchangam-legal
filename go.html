<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Pocket Panchangam</title>
</head>
<body style="background:#FAF6ED;margin:0;display:flex;align-items:center;justify-content:center;height:100vh;font-family:-apple-system,'Segoe UI',sans-serif">
<div style="text-align:center;padding:0 28px">
  <p id="msg" style="color:#6E5C4B;font-size:15px">🪔 Opening the store…</p>
  <a id="btn" href="#" style="display:none;background:#9E2233;color:#FFF;text-decoration:none;font-weight:800;font-size:17px;padding:15px 30px;border-radius:999px;margin-top:6px">📲 Get Pocket Panchangam</a>
  <p id="hint" style="display:none;color:#8F7F6B;font-size:12.5px;margin-top:12px">తెరవకపోతే పై బటన్ నొక్కండి</p>
  <div id="iab" style="display:none;background:#FFF;border:1px solid #E8DFCC;border-radius:14px;padding:14px 16px;margin-top:16px;text-align:left">
    <p style="margin:0;color:#26190F;font-size:14.5px;font-weight:700">యాప్ తెరవడం లేదా? ↗</p>
    <p style="margin:6px 0 0;color:#6E5C4B;font-size:13.5px;line-height:1.5">పైన కుడి మూలలో <b>⋯</b> నొక్కి, <b>"Open in external browser"</b> ఎంచుకోండి — వెంటనే స్టోర్ తెరుచుకుంటుంది.</p>
  </div>
</div>
<script>
(function () {
  // Influencer link: pocketpanchangam.com/go?r=<name>
  // Counts the click, then to the right store with campaign params.
  // In-app browsers (Instagram/FB/Line…) BLOCK silent store redirects, so:
  // native-scheme escape first, and a real tappable button always appears —
  // a user gesture is the one navigation no webview refuses.
  var q = new URLSearchParams(location.search);
  var r = (q.get("r") || "direct")
    .toLowerCase().replace(/[^a-z0-9_-]/g, "").slice(0, 24) || "direct";
  var ua = navigator.userAgent || "";
  var p = /iPhone|iPad|iPod/i.test(ua) ? "ios" : /Android/i.test(ua) ? "android" : "web";
  var pin = q.get("p");
  if (pin === "ios" || pin === "android") p = pin;
  var inApp = /Instagram|FBAN|FBAV|FB_IAB|Line\/|MicroMessenger|Snapchat|Twitter/i.test(ua);
  var id = r + "-" + Date.now() + "-" + Math.random().toString(36).slice(2, 8);
  try {
    fetch("https://firestore.googleapis.com/v1/projects/pocketpanchangam/databases/(default)/documents/clicks/" + id + "?key=AIzaSyCCWnpXL5StCbipAkvNk1Hc9RlUM9bvl64", {
      method: "PATCH",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ fields: { r: { stringValue: r }, p: { stringValue: p }, ts: { integerValue: String(Date.now()) } } }),
      keepalive: true
    }).catch(function () {});
  } catch (e) {}
  var APPLE_PT = "121493369";
  var iosQ = (APPLE_PT ? "pt=" + APPLE_PT + "&" : "") + "ct=" + r + "&mt=8";
  // canonical product URL — the /app/apple-store/ redirector white-screens
  // inside in-app webviews; the product page renders (and still carries pt/ct)
  var ios = "https://apps.apple.com/in/app/pocket-panchangam/id6787660096?" + iosQ;
  var iosScheme = "itms-apps://apps.apple.com/in/app/pocket-panchangam/id6787660096?" + iosQ;
  var ref = encodeURIComponent("utm_source=" + r + "&utm_medium=influencer&utm_campaign=" + r + "_launch");
  var andr = "https://play.google.com/store/apps/details?id=com.pocketpanchangam.app&referrer=" + ref;
  var andrScheme = "market://details?id=com.pocketpanchangam.app&referrer=" + ref;
  var target = p === "ios" ? ios : p === "android" ? andr : "/open.html";
  // The visible button. In-app browsers can swallow even gesture-driven
  // https navigation to the store — but a gesture-driven NATIVE SCHEME
  // (itms-apps / market) jumps straight to the store app, and a _blank
  // window is the backup escape. Both wired to the tap.
  if (p !== "web") {
    var scheme = p === "ios" ? iosScheme : andrScheme;
    var b = document.getElementById("btn");
    // In-app browsers: the button ESCAPES to the real browser (Safari via
    // x-safari-https, Android via intent), where our own redirect flies to
    // the store unimpeded — the technique current bio-link tools use.
    if (inApp && /Instagram/i.test(ua)) {
      b.href = "instagram://extbrowser";
    } else if (inApp && p === "ios") {
      b.href = "x-safari-https://pocketpanchangam.com/go?r=" + r + "&p=ios";
    } else if (inApp && p === "android") {
      b.href = "intent://pocketpanchangam.com/go?r=" + r + "&p=android#Intent;scheme=https;end";
    } else {
      b.href = target;
    }

    // A PLAIN anchor tap is the one pattern in-app browsers recognize and
    // hand to the store themselves (how every bio-link tool works). Zero JS
    // on the tap path — our earlier interception was the breakage. If she
    // is somehow still here seconds after tapping, teach Instagram's exit.
    b.addEventListener("click", function () {
      setTimeout(function () {
        if (!document.hidden) document.getElementById("iab").style.display = "block";
      }, 2500);
    }, { passive: true });
    setTimeout(function () {
      b.style.display = "inline-block";
      document.getElementById("hint").style.display = "block";
      document.getElementById("msg").textContent = "🪔 ఒక్క నొక్కు — యాప్ మీది";
    }, inApp ? 900 : 1800);
  }
  setTimeout(function () {
    if (p === "web") { location.replace(target); return; }
    if (inApp) {
      // Instagram's OWN scheme: asks Instagram itself to reopen this page
      // in the external browser (founder-discovered; unblockable since the
      // command is Instagram's, not an exit attempt). Safari then lands on
      // this same URL and the else-branch below flies to the store.
      if (/Instagram/i.test(ua)) {
        // fire only after the page has FULLY loaded and settled — firing
        // mid-load makes Instagram close the webview with nothing to hand
        // to Safari (observed on device)
        var fire = function () {
          setTimeout(function () { location.href = "instagram://extbrowser"; }, 700);
        };
        if (document.readyState === "complete") fire();
        else window.addEventListener("load", fire);
      }
    } else {
      location.replace(target);
    }
  }, 250);
})();
</script>
</body>
</html>
