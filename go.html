<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Pocket Panchangam</title>
</head>
<body style="background:#FAF6ED;margin:0;display:flex;align-items:center;justify-content:center;height:100vh;font-family:-apple-system,'Segoe UI',sans-serif">
<div style="text-align:center;padding:0 28px">
  <p id="msg" style="color:#6E5C4B;font-size:15px">🪔 Opening the store…</p>
  <a id="btn" href="#" style="display:none;background:#9E2233;color:#FFF;text-decoration:none;font-weight:800;font-size:17px;padding:15px 30px;border-radius:999px;margin-top:6px">📲 Get Pocket Panchangam</a>
  <p id="hint" style="display:none;color:#8F7F6B;font-size:12.5px;margin-top:12px">పై బటన్ నొక్కండి</p>
  <div id="iab" style="display:none;background:#FFF;border:1px solid #E8DFCC;border-radius:14px;padding:14px 16px;margin-top:16px;text-align:left">
    <p style="margin:0;color:#26190F;font-size:14.5px;font-weight:700">యాప్ తెరవడం లేదా? ↗</p>
    <p style="margin:6px 0 0;color:#6E5C4B;font-size:13.5px;line-height:1.5">పైన కుడి మూలలో <b>⋯</b> నొక్కి, <b>"Open in external browser"</b> ఎంచుకోండి.</p>
  </div>
</div>
<script>
(function () {
  // One-click store links that survive in-app browsers.
  // Mechanics (verified guide): IG/Threads iOS honors
  //   instagram://extbrowser/?url=<ENCODED> (load or click; hands URL to
  //   Safari). x-safari- via location.href is silently dropped in IG.
  //   FB/Messenger iOS: window.open('x-safari-'+url) inside a GESTURE only.
  //   Android webviews follow market:// fine. Escapes must run
  //   SYNCHRONOUSLY (no setTimeout/await before them). Zero-prompt iOS
  //   path requires the RAW apps.apple.com URL — never a redirecting hop;
  //   the click is counted by a beacon instead.
  var q = new URLSearchParams(location.search);
  var r = (q.get("r") || "direct")
    .toLowerCase().replace(/[^a-z0-9_-]/g, "").slice(0, 24) || "direct";
  var ua = navigator.userAgent || "";
  var p = /iPhone|iPad|iPod/i.test(ua) ? "ios" : /Android/i.test(ua) ? "android" : "web";
  var pin = q.get("p");
  if (pin === "ios" || pin === "android") p = pin;
  var isIG = /Instagram|Barcelona/i.test(ua);
  var isFB = /FBAN|FBAV|FB_IAB|Messenger/i.test(ua);
  var inApp = isIG || isFB || /Line\/|MicroMessenger|Snapchat|Twitter/i.test(ua);

  // click beacon — attribution log lives here, so the store URL stays raw
  try {
    var id = r + "-" + Date.now() + "-" + Math.random().toString(36).slice(2, 8);
    fetch("https://firestore.googleapis.com/v1/projects/pocketpanchangam/databases/(default)/documents/clicks/" + id + "?key=AIzaSyCCWnpXL5StCbipAkvNk1Hc9RlUM9bvl64", {
      method: "PATCH",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ fields: { r: { stringValue: r }, p: { stringValue: p }, ts: { integerValue: String(Date.now()) } } }),
      keepalive: true
    }).catch(function () {});
  } catch (e) {}

  var APPLE_PT = "121493369";
  var ios = "https://apps.apple.com/in/app/pocket-panchangam/id6787660096?" +
    (APPLE_PT ? "pt=" + APPLE_PT + "&" : "") + "ct=" + r + "&mt=8";
  var ref = encodeURIComponent("utm_source=" + r + "&utm_medium=influencer&utm_campaign=" + r + "_launch");
  var andrWeb = "https://play.google.com/store/apps/details?id=com.pocketpanchangam.app&referrer=" + ref;
  var andrMarket = "market://details?id=com.pocketpanchangam.app&referrer=" + ref;

  var escapeNow = function () {
    // must run synchronously — iOS drops scheme navs fired after timers
    if (p === "ios" && isIG) {
      location.href = "instagram://extbrowser/?url=" + encodeURIComponent(ios);
      return true;
    }
    if (p === "ios" && isFB) {
      try { window.open("x-safari-" + ios, "_blank"); return true; } catch (e) { return false; }
    }
    if (p === "android" && inApp) { location.href = andrMarket; return true; }
    return false;
  };

  var showFallback = function () {
    var b = document.getElementById("btn");
    b.href = p === "ios" ? ios : p === "android" ? andrWeb : "/open.html";
    if (inApp) {
      b.addEventListener("click", function (e) {
        if (p === "ios" && isFB) { e.preventDefault(); escapeNow(); }
        else if (p === "ios" && isIG) { e.preventDefault(); escapeNow(); }
        else if (p === "android") { e.preventDefault(); escapeNow(); }
      });
    }
    document.getElementById("msg").textContent = "🪔 ఒక్క నొక్కు — యాప్ మీది";
    b.style.display = "inline-block";
    document.getElementById("hint").style.display = "block";
    setTimeout(function () {
      if (!document.hidden) document.getElementById("iab").style.display = "block";
    }, 4000);
  };

  if (p === "web") { location.replace("/open.html"); return; }

  if (!inApp) {
    // normal browsers: straight to the store
    location.replace(p === "ios" ? ios : andrWeb);
    return;
  }

  // in-app: gesture-free escape attempt now (IG honors it from load),
  // watchdog flips to the button if no app-switch happens
  var escaped = (p === "ios" && isIG) || (p === "android") ? escapeNow() : false;
  var gone = false;
  var mark = function () { gone = true; };
  document.addEventListener("visibilitychange", mark);
  window.addEventListener("pagehide", mark);
  window.addEventListener("blur", mark);
  setTimeout(function () {
    if (!gone && !document.hidden) showFallback();
  }, escaped ? 1800 : 300);
})();
</script>
</body>
</html>
